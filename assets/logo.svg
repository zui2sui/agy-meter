    x2="92"
    y2="46"
    stroke="#f59e0b"
    stroke-width="6"
    stroke-linecap="round"
  />
  <circle cx="64" cy="70" r="7" fill="#06b6d4" />
  <!-- Telemetry pulse bars at base -->
  <rect x="40" y="92" width="8" height="14" rx="3" fill="#06b6d4" />
  <rect x="53" y="84" width="8" height="22" rx="3" fill="#06b6d4" />
  <rect x="66" y="88" width="8" height="18" rx="3" fill="#06b6d4" />
  <rect x="79" y="80" width="8" height="26" rx="3" fill="#f59e0b" />
</svg>
