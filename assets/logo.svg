<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
  <!-- Transparent background with ~12.5% margin around artwork (bounds 16..112) -->
  <!-- Outer subtle track arc -->
  <path
    d="M 26.5 88.5 A 45 45 0 1 1 101.5 88.5"
    stroke="#64748b"
    stroke-opacity="0.35"
    stroke-width="10"
    stroke-linecap="round"
  />
  <!-- High-contrast cyan speed arc (left to top-right) -->
  <path
    d="M 26.5 88.5 A 45 45 0 0 1 92.2 31.4"
    stroke="#06b6d4"
    stroke-width="10"
    stroke-linecap="round"
  />
  <!-- Amber peak velocity accent segment -->
  <path
    d="M 97.5 36.8 A 45 45 0 0 1 101.5 88.5"
    stroke="#f59e0b"
